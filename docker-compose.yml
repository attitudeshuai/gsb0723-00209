version: '3.8'

services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: laundry-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: laundry_db
      MYSQL_USER: laundry
      MYSQL_PASSWORD: laundry123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laundry-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laundry-backend
    restart: always
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: laundry_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laundry-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laundry-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - laundry-network

networks:
  laundry-network:
    driver: bridge

volumes:
  mysql_data:
